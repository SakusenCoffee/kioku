# Build the user manual (docs/manual, mdBook) and publish it to GitHub Pages:
# https://<owner>.github.io/<repo>/
# Needs Settings › Pages › Source: GitHub Actions.
name: manual

on:
  push:
    branches: [main]
    paths: ["docs/manual/**", "docs/privacy.md", ".github/workflows/manual.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./mdbook build docs/manual
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/manual/book
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
