# Server-mode image for self-hosting (web/docs/server.md):
# ghcr.io/<owner>/kioku-server for amd64 and arm64. The app files come from
# the release's kioku-web.tar.gz (web/tools/dist.sh output, built locally:
# the wasm toolchain doesn't run here); releases without it are skipped.
name: Web server image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with kioku-web.tar.gz
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: App files from the release
        id: files
        run: |
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx kioku-web.tar.gz; then
            echo "no kioku-web.tar.gz in $TAG: nothing to build"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p web/build/dist
          gh release download "$TAG" --pattern kioku-web.tar.gz --output - | tar -xz -C web/build/dist
          source shared/versions.env
          echo "ANKI_PY_VERSION=$ANKI_PY_VERSION" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kioku-server" >> "$GITHUB_ENV"
      - if: steps.files.outputs.skip != '1'
        uses: docker/setup-qemu-action@v3
      - if: steps.files.outputs.skip != '1'
        uses: docker/setup-buildx-action@v3
      - if: steps.files.outputs.skip != '1'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: steps.files.outputs.skip != '1'
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: ANKI_PY_VERSION=${{ env.ANKI_PY_VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }},${{ env.IMAGE }}:latest
