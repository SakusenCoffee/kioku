# docker compose up -d, then open https://<your proxy's address>/ (README.md)
services:
  anki:
    image: ghcr.io/krmanik/kioku-desktop:latest
    restart: unless-stopped
    shm_size: 1gb
    # time for Anki to close the collection and make its backup
    stop_grace_period: 1m
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: Etc/UTC
      CUSTOM_USER: anki
      PASSWORD: change-me
      # fit Anki's pages and windows on a phone's screen
      # ANKI_FIT_SCREEN: "true"
    volumes:
      - ./anki-config:/config
