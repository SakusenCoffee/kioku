# docker compose up -d, then open https://<your proxy's address>/ (docs/server.md)
services:
  kioku:
    image: ghcr.io/krmanik/kioku-server:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KIOKU_PASSWORD: change-me
    volumes:
      - ./kioku-data:/data
