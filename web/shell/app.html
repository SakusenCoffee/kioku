<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
    <title>Kioku</title>
    <style>
      html, body { padding: 0; margin: 0; overflow: hidden; height: 100%; background: #f5f5f5; }
      #screen { width: 100%; height: 100%; }
      #status { font: 15px system-ui, sans-serif; color: #555; text-align: center; margin-top: 30vh; }
    </style>
  </head>
  <body>
    <div id="status">Loading Kioku…</div>
    <div id="screen" style="display: none"></div>
    <script src="kioku-web.js"></script>
    <script src="kioku.js"></script>
    <script src="qtloader.js"></script>
    <script>
      (async function () {
        const status = document.querySelector("#status");
        const screen = document.querySelector("#screen");
        try {
          // Anki's pages are served by the service worker (sw.js), which
          // passes their requests to Python; it must control the page's
          // iframes before the first one loads
          await navigator.serviceWorker.register("sw.js");
          await navigator.serviceWorker.ready;
          await qtLoad({
            arguments: ["--kioku"],
            qt: {
              onLoaded: () => { status.style.display = "none"; screen.style.display = "block"; },
              onExit: (exit) => {
                status.textContent = "Kioku has stopped" + (exit.text ? `: ${exit.text}` : ".");
                status.style.display = "block";
                screen.style.display = "none";
              },
              entryFunction: window.kioku_entry,
              containerElements: [screen],
            },
          });
        } catch (e) {
          console.error(e);
          status.textContent = `Kioku could not start: ${e}`;
        }
      })();
    </script>
  </body>
</html>
